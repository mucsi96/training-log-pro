openapi: '3.0.2'
info:
  title: API
  version: '1.0'

servers:
  - url: http://localhost:8080

paths:

  /weight:
    get:
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                title: WeightHistory
                type: object
                required:
                  - measurements
                properties:
                  measurements:
                    type: array
                    items:
                      $ref: '#/components/schemas/WeightMeasurement'
                  baseline:
                    $ref: '#/components/schemas/WeightMeasurement'

  /ride/stats:
    get:
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                title: RideStats
                type: object
                properties:
                  calories:
                    type: number
                    format: double
                  elevationGain:
                    type: number
                    format: double
                  distance:
                    type: number
                    format: double
                  time:
                    type: integer
                    format: int64

  /ride/podium:
    get:
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PodiumMessage'
        '204':
          description: No podium achievement today

  /pushups:
    get:
      parameters:
        - in: query
          name: period
          required: false
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PushupSet'
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - count
              properties:
                count:
                  type: integer
                  minimum: -500
                  maximum: 500
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PushupSet'

  /day-goal:
    get:
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DayGoalStats'

  /day-goal/celebrate:
    post:
      responses:
        '204':
          description: Celebration marked as shown

  /coins:
    get:
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Coins'

  /coins/reset:
    post:
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Coins'

  /settings:
    get:
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
    put:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Settings'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'

  /fitness:
    get:
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                title: FitnessTimeline
                type: object
                required:
                  - measurements
                properties:
                  measurements:
                    type: array
                    items:
                      title: FitnessMeasurement
                      type: object
                      required:
                        - date
                        - fitness
                        - fatigue
                        - form
                      properties:
                        date:
                          type: string
                          format: date-time
                        fitness:
                          type: number
                          format: float
                        fatigue:
                          type: number
                          format: float
                        form:
                          type: number
                          format: float

  /ftp:
    get:
      parameters:
        - in: query
          name: period
          required: false
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                title: FtpTimeline
                type: object
                required:
                  - measurements
                properties:
                  measurements:
                    type: array
                    items:
                      title: FtpMeasurement
                      type: object
                      required:
                        - date
                        - ftp
                        - weight
                        - ftpPerKg
                      properties:
                        date:
                          type: string
                          format: date-time
                        ftp:
                          type: number
                          format: float
                        weight:
                          type: number
                          format: float
                        ftpPerKg:
                          type: number
                          format: float

  /reading/books:
    get:
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Book'
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
                - author
              properties:
                title:
                  type: string
                  minLength: 1
                  maxLength: 255
                author:
                  type: string
                  minLength: 1
                  maxLength: 255
                totalPages:
                  type: integer
                  minimum: 1
                  maximum: 100000
                startingPage:
                  type: integer
                  minimum: 0
                  maximum: 100000
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'

  /reading/books/{id}/progress:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - currentPage
              properties:
                currentPage:
                  type: integer
                  minimum: 0
                  maximum: 100000
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'

  /reading/books/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
    put:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
                - author
              properties:
                title:
                  type: string
                  minLength: 1
                  maxLength: 255
                author:
                  type: string
                  minLength: 1
                  maxLength: 255
                totalPages:
                  type: integer
                  minimum: 1
                  maximum: 100000
                startingPage:
                  type: integer
                  minimum: 0
                  maximum: 100000
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '400':
          description: Invalid request, e.g. startingPage or totalPages out of range
        '404':
          description: Book not found
    delete:
      responses:
        '204':
          description: No Content

  /reading/koreader-sync:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
                - author
                - totalPages
                - currentPage
              properties:
                title:
                  type: string
                  minLength: 1
                  maxLength: 255
                author:
                  type: string
                  minLength: 1
                  maxLength: 255
                totalPages:
                  type: integer
                  minimum: 1
                  maximum: 100000
                currentPage:
                  type: integer
                  minimum: 0
                  maximum: 100000
      responses:
        '204':
          description: No Content
        '400':
          description: Invalid request, e.g. currentPage greater than totalPages
        '401':
          description: Missing or invalid API token

  /devices:
    get:
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Device'
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 255
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedDevice'

  /devices/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
    delete:
      responses:
        '204':
          description: No Content
        '404':
          description: Device not found

  /devices/{id}/books:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
    post:
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceBook'
        '404':
          description: Device not found

  /devices/{id}/books/{bookId}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: bookId
        required: true
        schema:
          type: string
          format: uuid
    delete:
      responses:
        '204':
          description: No Content
        '404':
          description: Device or book not found

  /device/books:
    get:
      description: Pending books for the device identified by its API key
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeviceBook'
        '401':
          description: Missing or invalid API key

  /device/books/{id}/file:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
    get:
      description: Download a pending book with the device API key
      responses:
        '200':
          description: OK
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          description: Missing or invalid API key
        '404':
          description: Book not found for this device

  /device/books/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
    delete:
      description: Acknowledge a downloaded book with the device API key
      responses:
        '204':
          description: No Content
        '401':
          description: Missing or invalid API key
        '404':
          description: Book not found for this device

  /tasks:
    get:
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DailyTask'
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 255
      responses:
        '201':
          description: Created
          headers:
            Location:
              schema:
                type: string
              description: URL of the created task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyTask'

  /tasks/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
    put:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 255
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyTask'
        '404':
          description: Task not found
    delete:
      responses:
        '204':
          description: No Content
        '404':
          description: Task not found

  /tasks/today:
    get:
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DailyTaskStatus'

  /tasks/{id}/completion:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
    put:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - completed
              properties:
                completed:
                  type: boolean
      responses:
        '204':
          description: No Content
        '404':
          description: Task not found

components:
  schemas:
    WeightMeasurement:
      type: object
      required:
        - date
        - weight
      properties:
        date:
          type: string
          format: date-time
        weight:
          type: number
          format: float
        fatRatio:
          type: number
          format: float
        fatMassWeight:
          type: number
          format: float
    PushupSet:
      type: object
      required:
        - createdAt
        - count
      properties:
        createdAt:
          type: string
          format: date-time
        count:
          type: integer
    DayGoalTier:
      type: string
      description: Tiers of the day goal, from the most to the least demanding.
      enum:
        - GOLD
        - SILVER
        - BRONZE
    DayGoalMetric:
      type: string
      enum:
        - PUSHUPS
        - ELEVATION
        - READING_PAGES
        - DAILY_TASKS
    MetricGoal:
      type: object
      description: Whether a metric is required for a tier and, if so, how much of it.
      required:
        - metric
        - required
      properties:
        metric:
          $ref: '#/components/schemas/DayGoalMetric'
        required:
          type: boolean
        goal:
          description: Present when the metric is required.
          type: integer
          format: int32
          minimum: 1
          maximum: 100000
    TierGoals:
      type: object
      description: A tier is awarded when every required metric reaches its goal. A tier without a required metric is never awarded.
      required:
        - tier
        - goals
      properties:
        tier:
          $ref: '#/components/schemas/DayGoalTier'
        goals:
          type: array
          items:
            $ref: '#/components/schemas/MetricGoal'
    Settings:
      type: object
      required:
        - tiers
      properties:
        tiers:
          type: array
          items:
            $ref: '#/components/schemas/TierGoals'
    TierCount:
      type: object
      required:
        - tier
        - count
      properties:
        tier:
          $ref: '#/components/schemas/DayGoalTier'
        count:
          type: integer
          format: int32
    MetricValue:
      type: object
      required:
        - metric
        - value
      properties:
        metric:
          $ref: '#/components/schemas/DayGoalMetric'
        value:
          type: number
          format: double
    DayGoalStats:
      type: object
      description: Today's standing. nextTier is the least demanding attainable tier above todayTier, absent once there is none left to reach.
      required:
        - celebrateToday
        - currentStreak
        - monthCounts
        - todayProgress
        - tiers
      properties:
        todayTier:
          $ref: '#/components/schemas/DayGoalTier'
        nextTier:
          $ref: '#/components/schemas/DayGoalTier'
        celebrateToday:
          type: boolean
        currentStreak:
          type: integer
          format: int32
        monthCounts:
          type: array
          items:
            $ref: '#/components/schemas/TierCount'
        todayProgress:
          type: array
          items:
            $ref: '#/components/schemas/MetricValue'
        tiers:
          type: array
          items:
            $ref: '#/components/schemas/TierGoals'
    Book:
      type: object
      required:
        - id
        - title
        - author
        - startingPage
        - currentPage
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        author:
          type: string
        totalPages:
          type: integer
          format: int32
        startingPage:
          type: integer
          format: int32
        currentPage:
          type: integer
          format: int32
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        averagePagesPerDay:
          type: number
          format: double
        estimatedDaysRemaining:
          type: integer
          format: int32
    Device:
      type: object
      required:
        - id
        - name
        - createdAt
        - books
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        createdAt:
          type: string
          format: date-time
        books:
          type: array
          items:
            $ref: '#/components/schemas/DeviceBook'
    CreatedDevice:
      type: object
      required:
        - id
        - name
        - apiKey
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        apiKey:
          type: string
        createdAt:
          type: string
          format: date-time
    DeviceBook:
      type: object
      required:
        - id
        - fileName
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        fileName:
          type: string
        createdAt:
          type: string
          format: date-time
    Coins:
      type: object
      required:
        - totalCoins
        - totalPoints
        - pointsPerCoin
      properties:
        totalCoins:
          type: integer
          format: int32
        totalPoints:
          type: integer
          format: int32
        pointsPerCoin:
          type: integer
          format: int32
    DailyTask:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    DailyTaskStatus:
      type: object
      required:
        - id
        - name
        - completed
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        completed:
          type: boolean
    PodiumMessage:
      type: object
      required:
        - segmentName
        - segmentUrl
        - period
        - position
        - message
        - distance
        - elapsedTime
        - averageGrade
        - elevationGain
      properties:
        segmentName:
          type: string
        segmentUrl:
          type: string
        period:
          type: string
          enum:
            - WEEK
            - MONTH
            - ALL_TIME
        position:
          type: integer
          format: int32
          minimum: 1
          maximum: 3
        message:
          type: string
        distance:
          type: number
          format: float
        elapsedTime:
          type: integer
          format: int32
        averageGrade:
          type: number
          format: float
        elevationGain:
          type: number
          format: float
        averageWatts:
          type: number
          format: float
        averageWattsPerKg:
          type: number
          format: float
        fasterPosition:
          type: integer
          format: int32
        gapToFaster:
          type: integer
          format: int32
        slowerPosition:
          type: integer
          format: int32
        gapToSlower:
          type: integer
          format: int32
        latitudes:
          type: array
          items:
            type: number
            format: float
        longitudes:
          type: array
          items:
            type: number
            format: float
        distances:
          type: array
          items:
            type: number
            format: float
        altitudes:
          type: array
          items:
            type: number
            format: float

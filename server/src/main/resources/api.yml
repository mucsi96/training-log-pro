openapi: '3.0.2'
info:
  title: API
  version: '1.0'

servers:
  - url: http://localhost:8080

paths:

  /weight:
    get:
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                title: WeightHistory
                type: object
                required:
                  - measurements
                properties:
                  measurements:
                    type: array
                    items:
                      $ref: '#/components/schemas/WeightMeasurement'
                  baseline:
                    $ref: '#/components/schemas/WeightMeasurement'

  /ride/stats:
    get:
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                title: RideStats
                type: object
                properties:
                  calories:
                    type: number
                    format: double
                  elevationGain:
                    type: number
                    format: double
                  distance:
                    type: number
                    format: double
                  time:
                    type: integer
                    format: int64

  /ride/podium:
    get:
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PodiumMessage'
        '204':
          description: No podium achievement today

  /pushups:
    get:
      parameters:
        - in: query
          name: period
          required: false
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PushupSet'
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - count
              properties:
                count:
                  type: integer
                  minimum: -500
                  maximum: 500
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PushupSet'

  /golden-day:
    get:
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                title: GoldenDayStats
                type: object
                required:
                  - monthCount
                  - currentStreak
                  - todayGolden
                  - celebrateToday
                  - todayPushups
                  - todayElevationGain
                  - todayReadingPages
                  - pushupGoal
                  - elevationGoal
                  - readingPagesGoal
                  - todayTasksCompleted
                  - dailyTaskGoal
                  - goldenDates
                properties:
                  monthCount:
                    type: integer
                    format: int32
                  currentStreak:
                    type: integer
                    format: int32
                  todayGolden:
                    type: boolean
                  celebrateToday:
                    type: boolean
                  todayPushups:
                    type: integer
                    format: int32
                  todayElevationGain:
                    type: number
                    format: double
                  todayReadingPages:
                    type: integer
                    format: int32
                  pushupGoal:
                    type: integer
                    format: int32
                  elevationGoal:
                    type: integer
                    format: int32
                  readingPagesGoal:
                    type: integer
                    format: int32
                  todayTasksCompleted:
                    type: integer
                    format: int32
                  dailyTaskGoal:
                    type: integer
                    format: int32
                  goldenDates:
                    type: array
                    items:
                      type: string
                      format: date

  /golden-day/celebrate:
    post:
      responses:
        '204':
          description: Celebration marked as shown

  /coins:
    get:
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Coins'

  /coins/reset:
    post:
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Coins'

  /settings:
    get:
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
    put:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Settings'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'

  /fitness:
    get:
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                title: FitnessTimeline
                type: object
                required:
                  - measurements
                properties:
                  measurements:
                    type: array
                    items:
                      title: FitnessMeasurement
                      type: object
                      required:
                        - date
                        - fitness
                        - fatigue
                        - form
                      properties:
                        date:
                          type: string
                          format: date-time
                        fitness:
                          type: number
                          format: float
                        fatigue:
                          type: number
                          format: float
                        form:
                          type: number
                          format: float

  /ftp:
    get:
      parameters:
        - in: query
          name: period
          required: false
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                title: FtpTimeline
                type: object
                required:
                  - measurements
                properties:
                  measurements:
                    type: array
                    items:
                      title: FtpMeasurement
                      type: object
                      required:
                        - date
                        - ftp
                        - weight
                        - ftpPerKg
                      properties:
                        date:
                          type: string
                          format: date-time
                        ftp:
                          type: number
                          format: float
                        weight:
                          type: number
                          format: float
                        ftpPerKg:
                          type: number
                          format: float

  /reading/books:
    get:
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Book'
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
                - author
              properties:
                title:
                  type: string
                  minLength: 1
                  maxLength: 255
                author:
                  type: string
                  minLength: 1
                  maxLength: 255
                totalPages:
                  type: integer
                  minimum: 1
                  maximum: 100000
                startingPage:
                  type: integer
                  minimum: 0
                  maximum: 100000
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'

  /reading/books/{id}/progress:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - currentPage
              properties:
                currentPage:
                  type: integer
                  minimum: 0
                  maximum: 100000
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'

  /reading/books/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
    put:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
                - author
              properties:
                title:
                  type: string
                  minLength: 1
                  maxLength: 255
                author:
                  type: string
                  minLength: 1
                  maxLength: 255
                totalPages:
                  type: integer
                  minimum: 1
                  maximum: 100000
                startingPage:
                  type: integer
                  minimum: 0
                  maximum: 100000
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '400':
          description: Invalid request, e.g. startingPage or totalPages out of range
        '404':
          description: Book not found
    delete:
      responses:
        '204':
          description: No Content

  /tasks:
    get:
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DailyTask'
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 255
      responses:
        '201':
          description: Created
          headers:
            Location:
              schema:
                type: string
              description: URL of the created task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyTask'

  /tasks/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
    put:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 255
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyTask'
        '404':
          description: Task not found
    delete:
      responses:
        '204':
          description: No Content
        '404':
          description: Task not found

  /tasks/today:
    get:
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DailyTaskStatus'

  /tasks/{id}/completion:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
    put:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - completed
              properties:
                completed:
                  type: boolean
      responses:
        '204':
          description: No Content
        '404':
          description: Task not found

  /reading/stats:
    get:
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                title: ReadingStats
                type: object
                required:
                  - todayPages
                  - dailyPagesGoal
                  - goalReached
                properties:
                  todayPages:
                    type: integer
                    format: int32
                  dailyPagesGoal:
                    type: integer
                    format: int32
                  goalReached:
                    type: boolean

components:
  schemas:
    WeightMeasurement:
      type: object
      required:
        - date
        - weight
      properties:
        date:
          type: string
          format: date-time
        weight:
          type: number
          format: float
        fatRatio:
          type: number
          format: float
        fatMassWeight:
          type: number
          format: float
    PushupSet:
      type: object
      required:
        - createdAt
        - count
      properties:
        createdAt:
          type: string
          format: date-time
        count:
          type: integer
    Settings:
      type: object
      required:
        - pushupGoal
        - elevationGoal
        - readingPagesGoal
        - dailyTaskGoal
      properties:
        pushupGoal:
          type: integer
          format: int32
          minimum: 1
          maximum: 10000
        elevationGoal:
          type: integer
          format: int32
          minimum: 1
          maximum: 100000
        readingPagesGoal:
          type: integer
          format: int32
          minimum: 0
          maximum: 10000
        dailyTaskGoal:
          type: integer
          format: int32
          minimum: 0
          maximum: 100
        workStartTime:
          type: string
        workEndTime:
          type: string
        rainThresholdMm:
          type: number
          format: double
    Location:
      type: object
      required:
        - id
        - name
        - home
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        address:
          type: string
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        home:
          type: boolean
        bikeMinutesFromHome:
          type: integer
          format: int32
        carMinutesFromHome:
          type: integer
          format: int32
    LocationRequest:
      type: object
      required:
        - name
        - home
      properties:
        name:
          type: string
        address:
          type: string
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        home:
          type: boolean
        bikeMinutesFromHome:
          type: integer
          format: int32
        carMinutesFromHome:
          type: integer
          format: int32
    Activity:
      type: object
      required:
        - id
        - name
        - durationMinutes
        - occurrencesPerWeek
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        durationMinutes:
          type: integer
          format: int32
        occurrencesPerWeek:
          type: integer
          format: int32
        locationId:
          type: string
          format: uuid
        earliestTime:
          type: string
        latestTime:
          type: string
        daysOfWeek:
          type: string
        constraintNote:
          type: string
        priority:
          type: integer
          format: int32
    ActivityRequest:
      type: object
      required:
        - name
        - durationMinutes
        - occurrencesPerWeek
      properties:
        name:
          type: string
        durationMinutes:
          type: integer
          format: int32
        occurrencesPerWeek:
          type: integer
          format: int32
        locationId:
          type: string
          format: uuid
        earliestTime:
          type: string
        latestTime:
          type: string
        daysOfWeek:
          type: string
        constraintNote:
          type: string
        priority:
          type: integer
          format: int32
    Meeting:
      type: object
      required:
        - date
        - title
      properties:
        date:
          type: string
        title:
          type: string
        startTime:
          type: string
        endTime:
          type: string
        location:
          type: string
    WeekMeetings:
      type: object
      required:
        - meetings
      properties:
        meetings:
          type: array
          items:
            $ref: '#/components/schemas/Meeting'
    MeetingReview:
      type: object
      required:
        - date
        - title
        - attend
        - requiresOffice
      properties:
        date:
          type: string
        title:
          type: string
        startTime:
          type: string
        endTime:
          type: string
        location:
          type: string
        attend:
          type: boolean
        requiresOffice:
          type: boolean
    PlanWeekRequest:
      type: object
      required:
        - meetings
      properties:
        meetings:
          type: array
          items:
            $ref: '#/components/schemas/MeetingReview'
    ScheduleBlock:
      type: object
      required:
        - startTime
        - endTime
        - title
        - type
      properties:
        startTime:
          type: string
        endTime:
          type: string
        title:
          type: string
        type:
          type: string
        details:
          type: string
    DaySchedule:
      type: object
      required:
        - date
        - commuteMode
        - blocks
      properties:
        date:
          type: string
        commuteMode:
          type: string
        blocks:
          type: array
          items:
            $ref: '#/components/schemas/ScheduleBlock'
    WeekSchedule:
      type: object
      required:
        - weekStart
        - days
      properties:
        weekStart:
          type: string
        days:
          type: array
          items:
            $ref: '#/components/schemas/DaySchedule'
    Book:
      type: object
      required:
        - id
        - title
        - author
        - startingPage
        - currentPage
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        author:
          type: string
        totalPages:
          type: integer
          format: int32
        startingPage:
          type: integer
          format: int32
        currentPage:
          type: integer
          format: int32
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        averagePagesPerDay:
          type: number
          format: double
        estimatedDaysRemaining:
          type: integer
          format: int32
    Coins:
      type: object
      required:
        - totalCoins
        - totalPoints
        - pointsPerCoin
      properties:
        totalCoins:
          type: integer
          format: int32
        totalPoints:
          type: integer
          format: int32
        pointsPerCoin:
          type: integer
          format: int32
    DailyTask:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    DailyTaskStatus:
      type: object
      required:
        - id
        - name
        - completed
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        completed:
          type: boolean
    PodiumMessage:
      type: object
      required:
        - segmentName
        - segmentUrl
        - period
        - position
        - message
        - distance
        - elapsedTime
        - averageGrade
        - elevationGain
      properties:
        segmentName:
          type: string
        segmentUrl:
          type: string
        period:
          type: string
          enum:
            - WEEK
            - MONTH
            - ALL_TIME
        position:
          type: integer
          format: int32
          minimum: 1
          maximum: 3
        message:
          type: string
        distance:
          type: number
          format: float
        elapsedTime:
          type: integer
          format: int32
        averageGrade:
          type: number
          format: float
        elevationGain:
          type: number
          format: float
        averageWatts:
          type: number
          format: float
        averageWattsPerKg:
          type: number
          format: float
        fasterPosition:
          type: integer
          format: int32
        gapToFaster:
          type: integer
          format: int32
        slowerPosition:
          type: integer
          format: int32
        gapToSlower:
          type: integer
          format: int32
        latitudes:
          type: array
          items:
            type: number
            format: float
        longitudes:
          type: array
          items:
            type: number
            format: float
        distances:
          type: array
          items:
            type: number
            format: float
        altitudes:
          type: array
          items:
            type: number
            format: float

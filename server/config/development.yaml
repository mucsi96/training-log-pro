logger:
  enable: true
  level: info
  format: compact
server:
  binding: 127.0.0.1
  port: <%= get_env(name="PORT", default="8081") %>
  host: http://localhost
  middlewares:
    limit_payload:
      body_limit: 100mb
    etag:
      enable: false
    fallback:
      enable: false
workers:
  mode: BackgroundAsync
database:
  uri: <%= get_env(name="DATABASE_URL") %>
  enable_logging: false
  min_connections: 1
  max_connections: 10
  connect_timeout: 30000
  idle_timeout: 300000
  auto_migrate: true
  dangerously_truncate: false
  dangerously_recreate: false
  run_on_start: CREATE SCHEMA IF NOT EXISTS training_log
settings:
  oidc:
    issuer: <%= get_env(name="OIDC_ISSUER") %>
    audience: <%= get_env(name="API_CLIENT_ID") %>
  csrf_secure: true
  token_encryption_key: <%= get_env(name="TOKEN_ENCRYPTION_KEY") %>
  thunderforest_api_key: <%= get_env(name="THUNDERFOREST_API_KEY", default="") %>
  strava:
    client_id: <%= get_env(name="STRAVA_CLIENT_ID") %>
    client_secret: <%= get_env(name="STRAVA_CLIENT_SECRET") %>
    authorize_url: https://www.strava.com/oauth/authorize
    token_url: https://www.strava.com/oauth/token
    api_url: https://www.strava.com
    scope: activity:read
  withings:
    client_id: <%= get_env(name="WITHINGS_CLIENT_ID") %>
    client_secret: <%= get_env(name="WITHINGS_CLIENT_SECRET") %>
    authorize_url: https://account.withings.com/oauth2_user/authorize2
    token_url: https://wbsapi.withings.net/v2/oauth2
    api_url: https://wbsapi.withings.net
    scope: user.metrics
  daily_sync:
    cron: '<%= get_env(name="DAILY_SYNC_CRON", default="0 0 21 * * *") %>'
    zone: <%= get_env(name="DAILY_SYNC_ZONE", default="Europe/Budapest") %>

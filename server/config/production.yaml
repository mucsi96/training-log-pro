logger:
  enable: true
  level: info
  format: json
server:
  binding: 0.0.0.0
  port: <%= get_env(name="PORT", default="8080") %>
  host: http://localhost
  middlewares:
    limit_payload:
      body_limit: 100mb
    etag:
      enable: false
    fallback:
      enable: false
    secure_headers:
      enable: true
      preset: empty
      overrides:
        Cache-Control: no-store
        X-Content-Type-Options: nosniff
workers:
  mode: BackgroundAsync
database:
  uri: ""
  enable_logging: false
  min_connections: 1
  max_connections: 10
  connect_timeout: 30000
  idle_timeout: 300000
  auto_migrate: true
  dangerously_truncate: false
  dangerously_recreate: false
  run_on_start: CREATE SCHEMA IF NOT EXISTS training_log
settings:
  oidc:
    issuer: ""
    audience: ""
  csrf_secure: true
  token_encryption_key: ""
  thunderforest_api_key: ""
  strava:
    client_id: ""
    client_secret: ""
    authorize_url: https://www.strava.com/oauth/authorize
    token_url: https://www.strava.com/oauth/token
    api_url: https://www.strava.com
    scope: activity:read
  withings:
    client_id: ""
    client_secret: ""
    authorize_url: https://account.withings.com/oauth2_user/authorize2
    token_url: https://wbsapi.withings.net/v2/oauth2
    api_url: https://wbsapi.withings.net
    scope: user.metrics
  daily_sync:
    cron: <%= get_env(name="DAILY_SYNC_CRON", default="0 0 21 * * *") %>
    zone: <%= get_env(name="DAILY_SYNC_ZONE", default="Europe/Budapest") %>

[package]
name = "training-log-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace]
members = ["migration"]

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["multipart"] }
azure_identity = "1.0"
azure_security_keyvault_secrets = "1.0"
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
loco-rs = { version = "1.3", default-features = false, features = ["cli", "with-db", "db-postgres"] }
migration = { path = "migration" }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "form", "query"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
# Preserve shortest-roundtrip f32 numbers when composing JSON response values.
serde_json = { version = "1", features = ["arbitrary_precision"] }
sea-orm = { version = "2", default-features = false, features = ["macros", "sqlx-postgres", "runtime-tokio-rustls", "with-chrono", "with-uuid", "with-json"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tracing = "0.1"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = { version = "0.10", features = ["serde"] }
aes-gcm = "0.11"
base64 = "0.23"
percent-encoding = "2"
subtle = "2"
cron = "0.17"

[profile.release]
lto = "thin"
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"

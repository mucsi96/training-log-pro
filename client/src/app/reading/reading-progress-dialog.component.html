<h2 mat-dialog-title>{{ book.title }}</h2>
<mat-dialog-content class="dialog-content">
  <p class="author">{{ book.author }}</p>
  <bt-donut-slider
    class="slider"
    [(value)]="page"
    [min]="book.currentPage"
    [max]="totalPages"
    [valuePerTurn]="10"
    label="Page"
    [unit]="pageUnit"
  />
  <bt-donut-slider
    class="slider"
    [(value)]="minutes"
    [min]="0"
    [max]="1440"
    [valuePerTurn]="10"
    label="Minutes"
    unit="min"
  />
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()">Cancel</button>
  <button
    mat-flat-button
    bt-color="primary"
    type="button"
    [disabled]="!canSave()"
    (click)="save()"
  >
    Save {{ page() }}
  </button>
</mat-dialog-actions>

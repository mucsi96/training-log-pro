@let chart = chartOptions();
@if (periodSets.isLoading() || goldenDayGoal.isLoading()) {
<mat-spinner class="page-loading" />
} @else {
<section aria-labelledby="pushups-heading">
  <header class="header">
    <h2 id="pushups-heading">Pushups</h2>
  </header>

  @if (chart) {
  <button
    type="button"
    class="chart-wrapper"
    (click)="openAddDialog()"
    [disabled]="busy()"
    aria-label="Add pushups"
  >
    <div
      role="img"
      class="chart"
      echarts
      [options]="chart"
      [initOpts]="initOpts"
    ></div>
  </button>
  }
</section>
}

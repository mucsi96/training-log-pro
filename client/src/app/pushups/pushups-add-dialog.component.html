<h2 mat-dialog-title>Add pushups</h2>
<mat-dialog-content class="dialog-content">
  <bt-donut-slider
    class="slider"
    [(value)]="count"
    [valuePerTurn]="100"
    [min]="0"
    label="Pushups"
  />
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()">Cancel</button>
  <button
    mat-flat-button
    color="primary"
    type="button"
    [disabled]="!canAdd()"
    (click)="add()"
  >
    Add {{ count() }}
  </button>
</mat-dialog-actions>

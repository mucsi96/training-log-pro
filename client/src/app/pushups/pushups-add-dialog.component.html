<h2 mat-dialog-title>Add pushups</h2>
<mat-dialog-content class="dialog-content">
  <app-circular-slider
    class="slider"
    [(value)]="count"
    ariaLabel="Pushup set count"
  >
    <span class="count-value">{{ count() }}</span>
    <span class="count-label">pushups</span>
  </app-circular-slider>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()">Cancel</button>
  <button
    mat-flat-button
    color="primary"
    type="button"
    [disabled]="!canAdd()"
    (click)="add()"
  >
    Add {{ count() }}
  </button>
</mat-dialog-actions>

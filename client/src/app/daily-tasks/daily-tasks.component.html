@if (tasks.isLoading()) {
  <div class="page-loading"><bt-bar-loader /></div>
} @else if (hasTasks()) {
  <section class="daily-tasks" aria-labelledby="daily-tasks-heading">
    <header class="header">
      <h2 id="daily-tasks-heading">Daily tasks</h2>
      <p class="status">
        {{ completedCount() }} / {{ totalCount() }} done
      </p>
    </header>
    <mat-progress-bar mode="determinate" [value]="progress()" aria-label="Daily task completion" />
    <ul class="tasks" id="today-task-list">
      @for (task of visibleTasks(); track task.id) {
        <li class="task">
          <mat-checkbox
            [checked]="task.completed"
            [disabled]="togglingId() !== null"
            (change)="toggle(task.id, $event.checked)"
          >
            {{ task.name }}
          </mat-checkbox>
        </li>
      }
    </ul>
    @if (totalCount() > 2) {
      <button mat-button type="button" class="show-tasks" [attr.aria-expanded]="expanded()" aria-controls="today-task-list" (click)="expanded.set(!expanded())">
        {{ expanded() ? 'Show fewer tasks' : 'View all ' + totalCount() + ' tasks' }}
      </button>
    }
  </section>
}

<mat-toolbar class="header">
  <nav>
    <a class="brand" mat-button href="/">Tracker</a>
    @if (isAuthenticated() && isReady()) {
    <div class="nav-links">
      <a
        mat-button
        routerLink=""
        [routerLinkActiveOptions]="{ exact: true }"
        routerLinkActive
        ariaCurrentWhenActive="page"
        >Month</a
      >
      <a
        mat-button
        routerLink="year"
        routerLinkActive
        ariaCurrentWhenActive="page"
        >Year</a
      >
      <a
        mat-button
        routerLink="all-time"
        routerLinkActive
        ariaCurrentWhenActive="page"
        >All time</a
      >
    </div>
    <button
      type="button"
      class="nav-toggle"
      mat-button
      [matMenuTriggerFor]="navMenu"
      aria-label="Open navigation"
    >
      <span class="nav-toggle-icon" aria-hidden="true">
        <span></span>
        <span></span>
        <span></span>
      </span>
    </button>
    <mat-menu #navMenu="matMenu">
      <a
        mat-menu-item
        routerLink=""
        [routerLinkActiveOptions]="{ exact: true }"
        routerLinkActive
        ariaCurrentWhenActive="page"
        >Month</a
      >
      <a
        mat-menu-item
        routerLink="year"
        routerLinkActive
        ariaCurrentWhenActive="page"
        >Year</a
      >
      <a
        mat-menu-item
        routerLink="all-time"
        routerLinkActive
        ariaCurrentWhenActive="page"
        >All time</a
      >
    </mat-menu>
    <div class="header-right">
      <app-header></app-header>
    </div>
    }
  </nav>
</mat-toolbar>

<main>
  @if (authError(); as error) {
  <div class="auth-error" role="alert">
    <h1>Sign-in failed</h1>
    <p>The sign-in service rejected the request:</p>
    <p class="auth-error-details">{{ error }}</p>
    <button mat-flat-button (click)="retryLogin()">Try again</button>
  </div>
  } @else if (isAuthenticated() && !isReady()) {
  <div class="page-loading"><bt-bar-loader /></div>
  } @else {
  <router-outlet></router-outlet>
  }
</main>

name: Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test-server:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-test-server-${{ github.ref }}
      cancel-in-progress: true
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "maven"
      - run: mvn test -B -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn

  test-client:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-test-client-${{ github.ref }}
      cancel-in-progress: true
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm test

  build-server-image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: ${{ github.workflow }}-build-server-image-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      # The Spring profile is resolved during AOT processing and baked into the
      # native executable, so the e2e image is built with the test profile and
      # the published image (see publish-server) with the prod profile.
      - name: Build server image
        uses: docker/build-push-action@v6
        with:
          context: server
          build-args: SPRING_PROFILE=test
          tags: localhost/training-log-pro-server:test
          outputs: type=docker,dest=/tmp/server-image.tar
          cache-from: type=gha,scope=server-test
          cache-to: type=gha,mode=max,scope=server-test
      - name: Upload server image
        uses: actions/upload-artifact@v4
        with:
          name: server-image
          path: /tmp/server-image.tar
          retention-days: 1

  build-client-image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ${{ github.workflow }}-build-client-image-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build client image
        uses: docker/build-push-action@v6
        with:
          context: client
          tags: localhost/training-log-pro-client:test
          outputs: type=docker,dest=/tmp/client-image.tar
          cache-from: type=gha,scope=client
          cache-to: type=gha,mode=max,scope=client
      - name: Upload client image
        uses: actions/upload-artifact@v4
        with:
          name: client-image
          path: /tmp/client-image.tar
          retention-days: 1

  build-mock-withings-image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ${{ github.workflow }}-build-mock-withings-image-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build mock withings image
        uses: docker/build-push-action@v6
        with:
          context: mock_withings_server
          tags: localhost/training-log-pro-mock-withings:test
          outputs: type=docker,dest=/tmp/mock-withings-image.tar
          cache-from: type=gha,scope=mock-withings
          cache-to: type=gha,mode=max,scope=mock-withings
      - name: Upload mock withings image
        uses: actions/upload-artifact@v4
        with:
          name: mock-withings-image
          path: /tmp/mock-withings-image.tar
          retention-days: 1

  build-mock-strava-image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ${{ github.workflow }}-build-mock-strava-image-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build mock strava image
        uses: docker/build-push-action@v6
        with:
          context: mock_strava_server
          tags: localhost/training-log-pro-mock-strava:test
          outputs: type=docker,dest=/tmp/mock-strava-image.tar
          cache-from: type=gha,scope=mock-strava
          cache-to: type=gha,mode=max,scope=mock-strava
      - name: Upload mock strava image
        uses: actions/upload-artifact@v4
        with:
          name: mock-strava-image
          path: /tmp/mock-strava-image.tar
          retention-days: 1

  test-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: ${{ github.workflow }}-test-e2e-${{ github.ref }}
      cancel-in-progress: true
    needs:
      - build-server-image
      - build-client-image
      - build-mock-withings-image
      - build-mock-strava-image
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: test/package-lock.json
      - name: Install dependencies
        working-directory: test
        run: npm ci
      - name: Install Playwright browsers
        working-directory: test
        run: npx playwright install chromium --with-deps
      # Only the image tarballs. Without the pattern this also pulls the
      # .dockerbuild build records docker/build-push-action uploads on its own,
      # which this job has no use for and which failed the whole step when one
      # of them would not download.
      - name: Download images
        uses: actions/download-artifact@v4
        with:
          pattern: "*-image"
          path: /tmp
          merge-multiple: true
      - name: Load images into Podman
        run: |
          podman load -i /tmp/server-image.tar
          podman load -i /tmp/client-image.tar
          podman load -i /tmp/mock-withings-image.tar
          podman load -i /tmp/mock-strava-image.tar
      # The server is a single native executable, so if it cannot even start in
      # the runtime image there is nothing to log and the pod just times out two
      # minutes later with an empty container log. Fail here instead.
      - name: Check the server executable runs
        run: |
          timeout 60 podman run --rm localhost/training-log-pro-server:test \
            -XX:PrintFlags= > /dev/null
      - name: Setup test environment and start pod
        env:
          SKIP_BUILD: "1"
        run: scripts/pod_up.sh
      - name: Run Playwright tests
        working-directory: test
        run: npx playwright test
      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: test/test-results
      - name: Collect pod logs
        if: always()
        run: |
          for container in $(podman pod inspect training-log-pro-test --format '{{range .Containers}}{{.Name}} {{end}}' 2>/dev/null); do
            echo "$container" | grep -q "infra" && continue
            echo "=== $container ==="
            podman logs "$container" 2>&1 || true
          done

  publish-server:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      group: ${{ github.workflow }}-publish-server-${{ github.ref }}
      cancel-in-progress: true
    needs:
      - test-server
      - test-client
      - test-e2e
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get next version
        id: get_next_version
        uses: mucsi96/get-next-version@main
        with:
          prefix: 'server'
          src: server

      - name: Set up Docker Buildx
        if: steps.get_next_version.outputs.hasNextVersion == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: steps.get_next_version.outputs.hasNextVersion == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve server image tag
        if: steps.get_next_version.outputs.hasNextVersion == 'true'
        run: |
          echo "SERVER_IMAGE=docker.io/${{ secrets.DOCKERHUB_USERNAME }}/training-log-pro-server:${{ steps.get_next_version.outputs.version }}" >> "$GITHUB_ENV"

      # Built, then checked, then pushed - not build-and-push - so a prod
      # executable that cannot start never reaches Docker Hub.
      - name: Build server image
        if: steps.get_next_version.outputs.hasNextVersion == 'true'
        uses: docker/build-push-action@v6
        with:
          context: server
          load: true
          build-args: SPRING_PROFILE=prod
          tags: ${{ env.SERVER_IMAGE }}
          cache-from: type=gha,scope=server-prod
          cache-to: type=gha,mode=max,scope=server-prod

      # The profile is baked in at build time, so this is a different
      # executable from the one test-e2e exercised, and nothing else here runs
      # it. Be clear about how little this proves: -XX:PrintFlags= exits inside
      # the VM's own option parsing, before any Spring code runs, so it catches
      # a binary that cannot start at all - what a fully static link produces,
      # and what would otherwise first appear as a crash-looping pod - and
      # nothing beyond that. The prod profile's own wiring and the Key Vault
      # property source stay covered by the manual check in AGENTS.md alone.
      - name: Check the server executable runs
        if: steps.get_next_version.outputs.hasNextVersion == 'true'
        run: |
          timeout 60 docker run --rm "$SERVER_IMAGE" -XX:PrintFlags= > /dev/null

      - name: Push server image
        if: steps.get_next_version.outputs.hasNextVersion == 'true'
        run: docker push "$SERVER_IMAGE"

      # Tag the commit this image was actually built from. Without
      # target_commitish the release action tags whatever main points at when
      # the release is created, which is a different commit whenever another
      # push lands during the minutes the native build takes. The next run then
      # asks get-next-version for a version, sees the tag already on its own
      # HEAD, concludes nothing changed and publishes nothing - while deploy
      # still succeeds, on the previous commit's image.
      - name: Create release
        if: steps.get_next_version.outputs.hasNextVersion == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_next_version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true

  publish-client:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: ${{ github.workflow }}-publish-client-${{ github.ref }}
      cancel-in-progress: true
    needs:
      - test-server
      - test-client
      - test-e2e
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get next version
        id: get_next_version
        uses: mucsi96/get-next-version@main
        with:
          prefix: 'client'
          src: client

      - name: Set up Docker Buildx
        if: steps.get_next_version.outputs.hasNextVersion == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: steps.get_next_version.outputs.hasNextVersion == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push client image
        if: steps.get_next_version.outputs.hasNextVersion == 'true'
        uses: docker/build-push-action@v6
        with:
          context: client
          push: true
          tags: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/training-log-pro-client:${{ steps.get_next_version.outputs.version }}
          cache-from: type=gha,scope=client
          cache-to: type=gha,mode=max,scope=client

      # Tag the commit this image was built from, not whatever main points at
      # by the time the release is created - see publish-server above.
      - name: Create release
        if: steps.get_next_version.outputs.hasNextVersion == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_next_version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: ${{ github.workflow }}-deploy
      cancel-in-progress: false
    needs: [publish-server, publish-client]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: azure/use-kubelogin@v1
        with:
          kubelogin-version: 'v0.2.7'

      - name: Connect to Twingate
        uses: twingate/github-action@v1
        with:
          service-key: ${{ secrets.TWINGATE_SERVICE_KEY }}

      - name: Deploy to Kubernetes
        env:
          AZURE_KEYVAULT_NAME: ${{ secrets.AZURE_KEYVAULT_NAME }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: scripts/deploy.sh
